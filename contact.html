    <div class="contact-page">
        <h1>Contact Us</h1>
        <p class="contact-intro">
            Have a question or need help? <br>Send us a message and we will
            get back to you as soon as possible.
        </p>
        <form class="contact-form">
            <label for="name">Name</label>
            <input type="text"  id="name" placeholder="Enter your name" required >
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required >
            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required >
            <label for="subject">Subject</label>
            <select id="subject"> 
                <option value="">Choose a subject</option>  
                <option value="Movie-Request">Movie-Request</option>      
                <option value="Series-Request">Series-Request</option>      
                <option value="Report">Report a problem</option>      
                 <option value="Suggestion">Suggestion</option>      
                <option value="Feedback">Feedback</option>      
                <option value="Other">Other</option>      
            </select>
            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Write your message here..."  required ></textarea>
            <button type="submit"> Submit</button>
        </form>
    </div>
